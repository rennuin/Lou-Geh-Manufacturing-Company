<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lou Geh Manufacturing</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Lou Geh Manufacturing Company</h1>
  </header>
  
  <nav>
    <ul>
      <li><a href="#" onclick="showSection('products')">Products</a></li>
      <li><a href="#" onclick="showSection('components')">Components</a></li>
      <li><a href="#" onclick="showSection('suppliers')">Suppliers</a></li>
    </ul>
  </nav>
  
  <main>
    <section id="products" class="active">
      <h2>Products</h2>
      <button onclick="loadProducts()">Load Products</button>
      <button onclick="showAddProductForm()">Add New Product</button>
      
      <div id="add-product-form" style="display: none;">
  <h3>Add New Product</h3>
  <form id="product-form">
    <label for="product-name">Name:</label>
    <input type="text" id="product-name" required>

    <label for="product-quantity">Quantity:</label>
    <input type="number" id="product-quantity" required>

    <button type="submit">Save</button>
    <button type="button" onclick="cancelAddProduct()">Cancel</button>
  </form>
</div>

      
      
      <div id="products-list"></div>
    </section>
    
    <section id="components">
      <h2>Components</h2>
      <button onclick="loadComponents()">Load Components</button>
      <div id="components-list"></div>
    </section>
    
    <section id="suppliers">
      <h2>Suppliers</h2>
      <button onclick="loadSuppliers()">Load Suppliers</button>
      <div id="suppliers-list"></div>
    </section>
  </main>
  
  <script src="js/app.js"></script>
</body>
</html>
